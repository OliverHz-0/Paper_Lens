<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperLens — 论文深度解剖、课题管理与文献汇报 PPT 工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111318'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='14' cy='14' r='7'/%3E%3Cpath d='m19.5 19.5 5 5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Icon sprite (stroke icons, 24px grid) -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-lens" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path d="M7.75 9h5.5M7.75 12h3.5"/></symbol>
      <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h8M8 9h2"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></symbol>
      <symbol id="i-slides" viewBox="0 0 24 24"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    </svg>

    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btnToggleSidebar" class="icon-btn" type="button" aria-label="展开/收起课题栏" title="展开/收起课题栏" aria-controls="topicSidebar">
          <svg class="ic"><use href="#i-menu"/></svg>
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg class="ic"><use href="#i-lens"/></svg></span>
          <strong class="brand-name">PaperLens</strong>
        </div>
        <div class="paper-picker-wrap">
          <select id="paperSelect" class="paper-select" aria-label="切换论文" title="切换论文"></select>
        </div>
      </div>

      <nav class="nav-tabs" role="tablist" aria-label="工作台视图">
        <button class="nav-tab active" data-tab="overview" role="tab" aria-selected="true" title="六大维度总览">
          <svg class="ic"><use href="#i-overview"/></svg> 总览
        </button>
        <button class="nav-tab" data-tab="slices" role="tab" aria-selected="false" title="逐段切片精读">
          <svg class="ic"><use href="#i-file"/></svg> 逐段精读 <span id="sliceCountBadge" class="badge">0</span>
        </button>
        <button class="nav-tab" data-tab="glossary" role="tab" aria-selected="false" title="术语库">
          <svg class="ic"><use href="#i-book"/></svg> 术语库 <span id="glossaryCountBadge" class="badge">0</span>
        </button>
        <button class="nav-tab" data-tab="resources" role="tab" aria-selected="false" title="关联资源">
          <svg class="ic"><use href="#i-link"/></svg> 资源 <span id="resCountBadge" class="badge">0</span>
        </button>
        <button class="nav-tab" data-tab="compare" role="tab" aria-selected="false" title="文章对比关联">
          <svg class="ic"><use href="#i-compare"/></svg> 对比
        </button>
        <button class="nav-tab" data-tab="ppt" role="tab" aria-selected="false" title="文献汇报 PPT">
          <svg class="ic"><use href="#i-slides"/></svg> 汇报 PPT
        </button>
      </nav>

      <div class="topbar-right">
        <label class="beginner-toggle" title="突出显示零基础大白话翻译与生活化类比">
          <input type="checkbox" id="beginnerToggle" checked />
          <span class="toggle-pill" aria-hidden="true"></span>
          <span class="toggle-label">大白话</span>
        </label>
        <button id="btnUpload" class="btn btn-primary btn-sm" type="button">
          <svg class="ic"><use href="#i-upload"/></svg><span class="btn-label">上传 PDF</span>
        </button>
        <button id="btnMoreActions" class="icon-btn more-toggle" type="button" aria-label="更多操作" aria-expanded="false" aria-controls="secondaryActions">
          <svg class="ic"><use href="#i-more"/></svg>
        </button>
        <div id="secondaryActions" class="secondary-actions">
          <button id="btnZoteroTop" class="icon-btn" type="button" aria-label="从 Zotero 导入" title="从 Zotero / MCP 导入已下载文献">
            <svg class="ic"><use href="#i-library"/></svg><span class="menu-label">从 Zotero 导入</span>
          </button>
          <button id="btnExport" class="icon-btn" type="button" aria-label="导出 Markdown 报告" title="导出完整 Markdown 报告">
            <svg class="ic"><use href="#i-download"/></svg><span class="menu-label">导出 Markdown</span>
          </button>
          <button id="btnSettings" class="icon-btn" type="button" aria-label="设置" title="模型、Zotero 与代理设置">
            <svg class="ic"><use href="#i-settings"/></svg><span class="menu-label">设置</span>
          </button>
          <button id="btnTheme" class="icon-btn" type="button" aria-label="切换明暗主题" title="切换明暗主题">
            <svg class="ic"><use href="#i-moon"/></svg><span class="menu-label">明暗主题</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Workspace Layout: Left Topic Sidebar + Main Content -->
    <div id="workspaceShell" class="workspace-shell">
      <!-- Left Collapsible Topic Sidebar -->
      <aside id="topicSidebar" class="topic-sidebar" aria-label="课题文献侧边栏">
        <div class="sidebar-head">
          <strong><svg class="ic"><use href="#i-folder"/></svg>研究课题</strong>
          <button id="btnNewTopic" class="btn btn-ghost btn-xs" type="button"><svg class="ic"><use href="#i-plus"/></svg>新建</button>
        </div>

        <!-- Inline New Topic Form -->
        <div id="newTopicForm" class="new-topic-form hidden">
          <input id="newTopicName" type="text" placeholder="输入课题名称（如：抗结核肽）" />
          <input id="newTopicDesc" type="text" placeholder="课题简介（可选）" />
          <div class="color-dots" id="newTopicColors">
            <button type="button" class="cdot active" data-color="teal" style="background:#2a9d99"></button>
            <button type="button" class="cdot" data-color="blue" style="background:#62aef0"></button>
            <button type="button" class="cdot" data-color="amber" style="background:#dd5b00"></button>
            <button type="button" class="cdot" data-color="purple" style="background:#d6b6f6"></button>
            <button type="button" class="cdot" data-color="emerald" style="background:#1aae39"></button>
            <button type="button" class="cdot" data-color="rose" style="background:#ff64c8"></button>
          </div>
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button id="btnCancelNewTopic" type="button" class="btn btn-ghost btn-xs">取消</button>
            <button id="btnSaveNewTopic" type="button" class="btn btn-primary btn-xs">创建</button>
          </div>
        </div>

        <div id="topicList" class="topic-list"></div>

        <div class="sidebar-papers-section">
          <div class="sidebar-subhead">
            <span id="sidebarPaperListTitle">当前课题文献</span>
            <button id="btnAssignCurrentPaper" class="link-btn" title="把当前阅读的论文加入当前课题">＋ 归入此课题</button>
          </div>
          <div id="sidebarPaperList" class="sidebar-paper-list"></div>
        </div>

        <div class="sidebar-footer">
          <button id="btnOpenZotero" class="zotero-cta-btn">
            <span class="z-dot" id="zoteroStatusDot"></span>
            <div class="z-text">
              <strong>从 Zotero / MCP 导入</strong>
              <span id="zoteroStatusSub">正在检测本机 Zotero...</span>
            </div>
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="main-container">
        <!-- Hero Banner -->
        <section id="paperHero" class="paper-hero"></section>

        <!-- Tab 1: 6-Dimension Overview + Interactive Mind Map -->
        <section id="tab-overview" class="tab-panel active"></section>

        <!-- Tab 2: Slice-by-Slice Deep Reader + Interleaved Figure Cards + Dockable Mind Map -->
        <section id="tab-slices" class="tab-panel">
          <div class="slices-toolbar">
            <div id="sectionFilters" class="filter-chips"></div>
            <div class="slices-controls">
              <button id="btnToggleDockedMindmap" class="btn btn-secondary btn-sm" title="在左侧展开或收起思维导图导航分栏">导图分栏</button>
              <input id="sliceSearch" type="search" class="search-input" placeholder="搜索段落关键词、图号、术语..." />
              <div class="display-mode-group">
                <button class="mode-btn active" data-display="both">截图 + 双语</button>
                <button class="mode-btn" data-display="bilingual">纯双语</button>
                <button class="mode-btn" data-display="img_zh">截图 + 译文</button>
                <button class="mode-btn" data-display="image">仅截图</button>
              </div>
            </div>
          </div>
          <div id="slicesSplitLayout" class="slices-split-layout">
            <aside id="dockedMindmapPane" class="docked-mindmap-pane" aria-label="左侧思维导图导航"></aside>
            <div id="slicesList" class="slices-list"></div>
          </div>
        </section>

        <!-- Tab 3: Beginner Glossary -->
        <section id="tab-glossary" class="tab-panel"></section>

        <!-- Tab 4: Auto-Fetched Resources & Full References -->
        <section id="tab-resources" class="tab-panel"></section>

        <!-- Tab 5: Cross-Paper Comparison & Relation Synthesis -->
        <section id="tab-compare" class="tab-panel"></section>

        <!-- Tab 6: Literature Presentation PPT Studio -->
        <section id="tab-ppt" class="tab-panel"></section>
      </main>
    </div>
  </div>

  <!-- Slide-Over Right Drawer: Real-Time Citation Tracer & Term Inspector -->
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>
  <div id="sidebarScrim" class="sidebar-scrim" aria-hidden="true"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-label="实时溯源抽屉">
    <div class="drawer-header">
      <div id="drawerTitle" class="drawer-title">实时引文溯源</div>
      <button id="drawerClose" class="icon-close" type="button" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <!-- Modal: Upload PDF -->
  <div id="uploadModal" class="modal-backdrop hidden">
    <div role="dialog" aria-modal="true" class="modal-card">
      <div class="modal-header">
        <h3>上传论文 PDF</h3>
        <button class="icon-close" type="button" data-close-modal="uploadModal" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <div id="dropZone" class="drop-zone">
          <div class="drop-icon"><svg class="ic"><use href="#i-upload"/></svg></div>
          <p class="drop-title">将论文 PDF 拖到这里，或点击选择文件</p>
          <p class="drop-sub">自动完成：双栏逐段精准切图 · 图表裁切 · 参考文献提取 · GitHub/SI 自动抓取 · AI 零基础解读</p>
          <input id="pdfFileInput" type="file" aria-label="选择 PDF 文件" accept="application/pdf,.pdf" hidden />
          <button id="pickPdfBtn" class="btn btn-primary">选择 PDF 文件</button>
        </div>
        <div class="upload-options">
          <label class="form-field" style="margin-bottom:10px">
            <span>导入后归入课题</span>
            <select id="uploadTopicSelect" class="paper-select" style="max-width:100%"></select>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="uploadRunLlm" checked />
            <span>解析完成后自动运行 AI 零基础深度解读（需已在设置中配置 API Key；未配置则自动进入极速结构化切图模式）</span>
          </label>
        </div>
        <div id="uploadProgressBox" class="progress-box hidden">
          <div class="progress-head">
            <span id="uploadStatusText">准备中...</span>
            <strong id="uploadPctText">0%</strong>
          </div>
          <div class="progress-track">
            <div id="uploadProgressBar" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Zotero / Zotero MCP Importer -->
  <div id="zoteroModal" class="modal-backdrop hidden">
    <div role="dialog" aria-modal="true" class="modal-card modal-wide">
      <div class="modal-header">
        <h3>从 Zotero 导入</h3>
        <button class="icon-close" type="button" data-close-modal="zoteroModal" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <div id="zoteroConnBanner" class="zotero-conn-banner"></div>

        <details class="zotero-mcp-config">
          <summary>高级：Zotero MCP 连接</summary>
          <div class="mcp-form-row">
            <input id="zoteroMcpCmdInput" type="text" placeholder="Zotero MCP 启动命令，例如：uvx zotero-mcp 或 zotero-mcp" />
            <button id="btnProbeZoteroMcp" class="btn btn-secondary btn-sm">测试 MCP 连接</button>
          </div>
          <div id="zoteroMcpResult" class="hint-text" style="margin-top:8px"></div>
        </details>

        <div class="zotero-toolbar">
          <div id="zoteroColChips" class="filter-chips"></div>
          <div class="zotero-search-row">
            <input id="zoteroSearch" type="search" class="search-input" placeholder="搜索 Zotero 文献标题、作者、期刊..." />
            <label class="checkbox-row" style="white-space:nowrap">
              <input type="checkbox" id="zoteroHideTranslated" checked />
              <span>隐藏译文/双语副本</span>
            </label>
          </div>
        </div>

        <div id="zoteroItemList" class="zotero-item-list"></div>

        <div class="zotero-import-bar">
          <div class="zotero-import-opts">
            <select id="zoteroTargetTopic" class="paper-select" style="max-width:260px"></select>
            <label class="checkbox-row">
              <input type="checkbox" id="zoteroRunLlm" checked />
              <span>导入后自动运行 AI 深度解读（使用设置中的模型）</span>
            </label>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span id="zoteroSelectedCount" style="font-size:13px;font-weight:700;color:var(--primary)">已选 0 篇</span>
            <button id="btnDoZoteroImport" class="btn btn-primary" disabled>导入并解析</button>
          </div>
        </div>

        <div id="zoteroProgressBox" class="progress-box hidden">
          <div class="progress-head">
            <span id="zoteroProgressMsg">准备导入...</span>
            <strong id="zoteroProgressPct">0%</strong>
          </div>
          <div class="progress-track">
            <div id="zoteroProgressBar" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Settings (LLM, Zotero & Proxy) -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div role="dialog" aria-modal="true" class="modal-card">
      <div class="modal-header">
        <h3>设置</h3>
        <button class="icon-close" type="button" data-close-modal="settingsModal" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <p class="hint-text">选一个预设快速填入，或在下方手动配置。</p>
        <div id="llmPresetBar" class="filter-chips" style="margin-bottom:12px">
          <button type="button" class="chip active" data-llm-preset="agy_neon">Antigravity · Gemini 4 Neon（免 Key）</button>
          <button type="button" class="chip" data-llm-preset="agy_flash">Antigravity · Gemini 3.8 Flash</button>
          <button type="button" class="chip" data-llm-preset="deepseek">DeepSeek API</button>
          <button type="button" class="chip" data-llm-preset="gemini">Google Gemini API</button>
          <button type="button" class="chip" data-llm-preset="qwen">通义千问 Qwen</button>
          <button type="button" class="chip" data-llm-preset="ollama">本地 Ollama</button>
        </div>
        <div class="form-grid">
          <label class="form-field">
            <span>调用引擎类型</span>
            <select id="cfgProvider" class="paper-select" style="max-width:100%">
              <option value="agy_cli">本机 Antigravity CLI（agy，免 API Key）</option>
              <option value="openai_compatible">OpenAI 兼容 HTTP API（DeepSeek / Gemini / Qwen / OpenAI / Ollama）</option>
            </select>
          </label>
          <label class="form-field">
            <span>Model 名称</span>
            <input id="cfgModel" type="text" placeholder="gemini-4-neon-high / deepseek-chat / gemini-2.5-flash" />
          </label>
          <label class="form-field" id="cfgBaseUrlRow">
            <span>API Base URL（仅 HTTP API 模式需要）</span>
            <input id="cfgBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
          </label>
          <label class="form-field" id="cfgApiKeyRow">
            <span>API Key（Antigravity CLI 与本地 Ollama 留空即可）</span>
            <input id="cfgApiKey" type="password" placeholder="sk-..." />
          </label>
          <label class="form-field">
            <span>Zotero 数据目录（含 zotero.sqlite 与 storage）</span>
            <input id="cfgZoteroDir" type="text" placeholder="/Users/你的用户名/Zotero" />
          </label>
          <label class="form-field">
            <span>Zotero MCP 启动命令（可选，如 uvx zotero-mcp）</span>
            <input id="cfgZoteroMcp" type="text" placeholder="留空则直接读取本机 Zotero 数据库与本地 API" />
          </label>
          <label class="form-field">
            <span>PPT-Master 本地仓库目录</span>
            <input id="cfgPptMasterDir" type="text" placeholder="/Users/你的用户名/ppt-master" />
          </label>
          <label class="form-field">
            <span>可选 HTTP 代理（用于在线实时抓取引文与 GitHub）</span>
            <input id="cfgProxy" type="text" placeholder="例如 http://127.0.0.1:7890（留空直连）" />
          </label>
        </div>
        <div class="modal-actions">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="btnTestLlm" class="btn btn-ghost">测试连通性</button>
            <button id="btnRunLlmCurrent" class="btn btn-secondary">解读当前论文</button>
          </div>
          <button id="btnSaveConfig" class="btn btn-primary">保存配置</button>
        </div>
        <div id="settingsToast" class="toast-inline hidden"></div>
        <p class="hint-text settings-note">使用 Antigravity CLI 时，PaperLens 会调用本机已登录的 <code>agy</code> 完成解读，不需要 API Key。</p>
      </div>
    </div>
  </div>

  <!-- Embedded Official PPT-Master SVG Editor Modal -->
  <div id="svgEditorModal" class="modal-backdrop hidden">
    <div role="dialog" aria-modal="true" class="modal-card" style="width:min(1320px,97vw);height:92vh;display:flex;flex-direction:column">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h3>SVG 编辑器</h3>
          <a id="svgEditorExternalLink" href="#" target="_blank" class="btn btn-ghost btn-xs">新窗口打开 ↗</a>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="btnRecompileAfterEdit" class="btn btn-primary btn-sm">重新质检并编译 .pptx</button>
          <button class="icon-close" type="button" data-close-modal="svgEditorModal" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
      </div>
      <iframe id="svgEditorIframe" src="about:blank" style="flex:1;width:100%;border:none;background:#ffffff"></iframe>
    </div>
  </div>

  <!-- Full-Screen Presentation Mode Overlay -->
  <div id="presentOverlay" class="present-overlay hidden">
    <div class="present-topbar">
      <span id="presentCounter">1 / 10</span>
      <div style="display:flex;gap:8px">
        <button id="presentToggleNotes" class="btn btn-ghost btn-sm">演讲备注</button>
        <button id="presentPrev" class="btn btn-ghost btn-sm">← 上一页</button>
        <button id="presentNext" class="btn btn-primary btn-sm">下一页 →</button>
        <button id="presentExit" class="btn btn-ghost btn-sm">退出 (Esc)</button>
      </div>
    </div>
    <div id="presentStage" class="present-stage"></div>
    <div id="presentNotesBar" class="present-notes-bar hidden"></div>
  </div>

  <!-- Full-Screen Image Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lightboxClose" class="lightbox-close">关闭</button>
    <div class="lightbox-inner">
      <img id="lightboxImg" alt="放大预览" />
      <p id="lightboxCaption" class="lightbox-caption"></p>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
